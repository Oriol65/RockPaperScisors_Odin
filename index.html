<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <div class="header">
        <h1 id="title">Rock Paper Scissors</h1>
    </div>
    <div class="score">
        <h2>Score</h2>
        <div>        
            <div class="player"><p>Player: </p><h3 id="playerScoreDisplay">0</h3> </div>
            <div class="computer"><p>PC: </p><h3 id="computerScoreDisplay">0</h3> </div>
        </div>

    </div>

    <div class="playerChoice">
        <button id="playerRock">
            <img src="./images/rock.svg" height="200px" width="150px" alt="Rock">
            <p><strong>Rock</strong></p>
        </button>
        <button id="playerPaper">
            <img src="./images/paper.svg" height="200px" width="150px" alt="Paper">
            <p><strong>Paper</strong></p>
        </button>
        <button id="playerScissors">
            <img src="./images/scissors.svg" height="200px" width="150px" alt="Scissors">
            <p><strong>Scissors</strong></p>
        </button>
    </div>
    <div class="footer"><p><i><b>This is a footer!</b></i></p></div>
</body>
</html>
