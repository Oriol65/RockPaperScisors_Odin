<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <div class="header">
        <h1 id="title">Rock Paper Scissors</h1>
    </div>
    <div class="score">
        <h2>Score</h2>
        <div>        
            <div class="player"><p>Player: </p><h3 id="playerScoreDisplay">0</h3> </div>
            <div class="computer"><p>PC: </p><h3 id="computerScoreDisplay">0</h3> </div>
        </div>

    </div>
    <div class="computerChoice">
        <img id="computerPicture" class="" src="https://www.shutterstock.com/image-vector/hand-drawn-pc-monitor-screen-600nw-1557299351.jpg" alt="computer">
    </div>
    <div class="playerChoice">
        <button id="playerRock">
            <img src="https://img.freepik.com/free-psd/grey-boulder-rock-isolated-transparent-background_632498-25568.jpg" height="300px" width="200px" alt="Rock">
            <p><strong>Rock</strong></p>
        </button>
        <button id="playerPaper">
            <img src="https://cdn.pixabay.com/photo/2016/10/23/15/47/paper-1763262_640.png" height="300px" width="200px" alt="Paper">
            <p><strong>Paper</strong></p>
        </button>
        <button id="playerScissors">
            <img src="https://img.freepik.com/premium-vector/isolated-open-scissors-symbol-set-scissors-cutting-paperscissoring_1114531-6359.jpg?semt=ais_hybrid&w=740&q=80" height="300px" width="200px" alt="Scissors">
            <p><strong>Scissors</strong></p>
        </button>
    </div>
    <div class="footer"><p><i><b>This is a footer!</b></i></p></div>
</body>
</html>
